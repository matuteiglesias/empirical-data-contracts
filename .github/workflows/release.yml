name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          VERSION=$(python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify built wheel in a fresh environment
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

          python -m venv /tmp/empirical-contracts-release
          /tmp/empirical-contracts-release/bin/python -m pip install --upgrade pip
          /tmp/empirical-contracts-release/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/empirical-contracts-release/bin/python - <<'PY'
          import empirical_contracts

          contract = empirical_contracts.SourceFileRef(
              path="source.bin",
              sha256="0" * 64,
              size_bytes=1,
          )
          payload = contract.model_dump_json()
          assert empirical_contracts.SourceFileRef.model_validate_json(payload) == contract
          print(empirical_contracts.__file__)
          PY

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/empirical-data-contracts
    permissions:
      id-token: write

    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
